<!DOCTYPE html>
<html lang="th" data-theme-default="auto">
<head>

<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:title" content="Beach Budget — เว็บบันทึกรายรับรายจ่าย">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app">
  <!-- แถบข้าง -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark" aria-hidden="true">🏖️</span>
      <span><b>Beach Budget</b><small>รายรับ–รายจ่ายส่วนตัว</small></span>
    </div>

    <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>

    <div class="side-foot">
      <div class="demo-note">
        <b>ชุดข้อมูลทดสอบ</b>

      <div class="who" id="who"></div>
    </div>
  </aside>

  <!-- เนื้อหา -->
  <main>

    </div>
  </main>

<div class="scrim" id="scrim"></div>

<div class="modal-bg" id="modal-bg" role="dialog" aria-modal="true" aria-label="หน้าต่างรายการ">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
